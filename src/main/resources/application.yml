server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: executeme
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:executeme;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

smartapi:
  api-key: ${SMARTAPI_API_KEY:}
  secret-key: ${SMARTAPI_SECRET_KEY:}
  redirect-url: ${SMARTAPI_REDIRECT_URL:http://localhost:8080/broker/angel/callback}
  login-endpoint: https://smartapi.angelone.in/publisher-login
  root-url: ${SMARTAPI_ROOT_URL:https://apiconnect.angelone.in}
  client-local-ip: ${SMARTAPI_CLIENT_LOCAL_IP:127.0.0.1}
  client-public-ip: ${SMARTAPI_CLIENT_PUBLIC_IP:127.0.0.1}
  mac-address: ${SMARTAPI_MAC_ADDRESS:00:00:00:00:00:00}
  user-type: ${SMARTAPI_USER_TYPE:USER}
  source-id: ${SMARTAPI_SOURCE_ID:WEB}

token-security:
  jwt-signing-secret: ${JWT_SIGNING_SECRET:}
  encryption-secret: ${TOKEN_ENCRYPTION_SECRET:${JWT_SIGNING_SECRET:}}
  state-ttl-minutes: ${STATE_TTL_MINUTES:5}

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:}
    token: ${TELEGRAM_BOT_TOKEN:}
    allowed-user-ids: ${TELEGRAM_ALLOWED_USER_IDS:}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: WARN

execution:
  recovery-delay-ms: ${EXECUTION_RECOVERY_DELAY_MS:60000}

broker:
  sessions:
    expiry-scan-delay-ms: ${BROKER_SESSION_EXPIRY_SCAN_DELAY_MS:60000}
